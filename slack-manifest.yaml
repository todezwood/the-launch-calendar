display_information:
  name: Hobbes
  description: Hobbes, the launch calendar agent. Tell me what's shipping and I keep the calendar straight.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Hobbes
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - channels:history
      - users:read
      - reactions:write
      - reactions:read     # 👍 / 👎 on a reply is recorded as its rating
settings:
  # Add after the service is deployed (Bolt answers the URL verification challenge):
  # event_subscriptions:
  #   request_url: https://<cloud-run-url>/slack/events
  #   bot_events:
  #     - app_mention
  #     - message.im
  #     - reaction_added
  #     - message.channels   # every message in the launches channel is answered, no @mention needed
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
